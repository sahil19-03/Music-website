<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Song</title>
  <link rel="stylesheet" href="spotify.css">
  <style>
    body {
      margin: 0;
      font-family: "Montserrat", sans-serif;
      color: white;
      background-color: #121212;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(0, 0, 0, 0.8);
      text-align: center;
      padding: 10px;
    }

    main {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      background-size: cover;
      background-position: center;
    }

    .song-info {
      position: absolute;
      bottom: 100px;
      left: 20px;
      background: rgba(0, 0, 0, 0.5);
      padding: 15px 25px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
    }

    .song-controls {
      margin-bottom: 20px;
    }

    #play-btn {
      font-size: 25px;
      background-color: #1db954;
      border: none;
      border-radius: 50%;
      padding: 10px 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    #play-btn:hover {
      background-color: #18a74b;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎵 Now Playing</h1>
    <a href="index.html" style="color:white;text-decoration:none;">⬅ Back</a>
  </header>

  <main id="song-main">
    <div class="song-info">
      <h2 id="songTitle">Loading...</h2>
      <p id="songArtist">Please wait</p>
    </div>
    <div class="song-controls">
      <button id="play-btn">▶</button>
    </div>
  </main>

  <footer class="spotify-footer">
    <div class="footer-player">
      <div class="footer-song-info">
        <img id="footerCover" src="default-cover.png" alt="cover" class="footer-cover">
        <div>
          <h4 id="footerTitle">Song Title</h4>
          <p id="footerArtist">Artist Name</p>
        </div>
      </div>

      <div class="footer-controls">
        <button id="footerPlayPause">▶</button>
        <input type="range" id="progressSlider" class="progress-slider" min="0" value="0">
      </div>

      <div class="footer-volume">
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.5">
      </div>
    </div>

    <audio id="audioPlayer" style="display:none;"></audio>
    <p class="footer-bottom">© 2025 AB</p>
  </footer>

  <script>
    const API_BASE = 'http://127.0.0.1:5000';

    document.addEventListener("DOMContentLoaded", async () => {
      console.log('🎵 clickedsongs.html loaded');
      
      const params = new URLSearchParams(window.location.search);
      const songId = params.get("id");

      if (!songId) {
        console.warn('⚠️ No song ID provided');
        document.getElementById("songTitle").innerText = "❌ No Song Selected";
        return;
      }

      try {
        console.log('📡 Fetching song:', songId);
        const res = await fetch(`${API_BASE}/songs/${songId}`);
        
        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }

        const song = await res.json();
        console.log('✅ Song loaded:', song);

        const artistName = song.artist?.name || 'Unknown Artist';
        const coverUrl = song.coverUrl || 'default-cover.png';

        // Update main page section (big display)
        document.getElementById("songTitle").innerText = song.title;
        document.getElementById("songArtist").innerText = artistName;
        document.getElementById("song-main").style.backgroundImage = `url(${coverUrl})`;

        // Update footer player (same song info)
        document.getElementById("footerTitle").innerText = song.title;
        document.getElementById("footerArtist").innerText = artistName;
        document.getElementById("footerCover").src = coverUrl;

        // Setup audio player
        const audioPlayer = document.getElementById("audioPlayer");
        audioPlayer.src = song.audioUrl;
        
        console.log('✅ Audio source set:', song.audioUrl);

        // Sync play/pause buttons
        const mainPlayBtn = document.getElementById("play-btn");
        const footerPlayBtn = document.getElementById("footerPlayPause");
        const progressSlider = document.getElementById("progressSlider");
        const volumeSlider = document.getElementById("volumeSlider");
        
        let isPlaying = false;

        // Main button click
        mainPlayBtn.addEventListener("click", () => {
          if (isPlaying) {
            audioPlayer.pause();
            mainPlayBtn.innerText = "▶";
            footerPlayBtn.innerText = "▶";
            isPlaying = false;
          } else {
            audioPlayer.play();
            mainPlayBtn.innerText = "⏸";
            footerPlayBtn.innerText = "⏸";
            isPlaying = true;
          }
        });

        // Footer button click
        footerPlayBtn.addEventListener("click", () => {
          if (isPlaying) {
            audioPlayer.pause();
            mainPlayBtn.innerText = "▶";
            footerPlayBtn.innerText = "▶";
            isPlaying = false;
          } else {
            audioPlayer.play();
            mainPlayBtn.innerText = "⏸";
            footerPlayBtn.innerText = "⏸";
            isPlaying = true;
          }
        });

        // Progress bar updates
        audioPlayer.addEventListener("timeupdate", () => {
          if (audioPlayer.duration) {
            progressSlider.max = 100;
            progressSlider.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
          }
        });

        // Seek functionality
        progressSlider.addEventListener("input", () => {
          if (audioPlayer.duration) {
            audioPlayer.currentTime = (progressSlider.value / 100) * audioPlayer.duration;
          }
        });

        // Volume control
        volumeSlider.addEventListener("input", () => {
          audioPlayer.volume = volumeSlider.value;
        });

        // Auto-play the song
        audioPlayer.play();
        mainPlayBtn.innerText = "⏸";
        footerPlayBtn.innerText = "⏸";
        isPlaying = true;

        console.log('✅ Song page ready!');

      } catch (err) {
        console.error("❌ Error loading song:", err);
        document.getElementById("songTitle").innerText = "❌ Error loading song";
        document.getElementById("songArtist").innerText = "Please check backend server";
      }
    });
  </script>
</body>
</html>
